# T-091 · Netlify, plan gratuito. En la raíz con `base`: el repo no tiene package.json arriba y así
# el directorio base queda versionado en vez de depender de un campo de la UI. Las rutas de abajo
# son relativas a `base`. Sin secretos: las variables viven en Site configuration > Environment
# variables (ver docs/deploy-netlify.md).
[build]
  base = "webApp"
  # Sin caché de Next entre builds: el 2026-11-09 un build reusó globals.css viejo con tokens.css
  # nuevo y producción salió sin las reglas .cosmico (títulos oscuros sobre el cielo). check-seo lo vigila.
  command = "rm -rf .next/cache && npm run build"
  publish = ".next"

[build.environment]
  # Igual que .nvmrc. Netlify busca .nvmrc en `base`, y el nuestro está en la raíz.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Adaptador de Next declarado y fijado (devDependency 5.16.5): la autoinstalación del runtime no
# corrió en el primer build desde Git (deploy sin funciones, todo 404).
[[plugins]]
  package = "@netlify/plugin-nextjs"
