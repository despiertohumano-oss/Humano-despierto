# T-091 · Netlify, plan gratuito. En la raíz con `base`: el repo no tiene package.json arriba y así
# el directorio base queda versionado en vez de depender de un campo de la UI. Las rutas de abajo
# son relativas a `base`. Sin secretos: las variables viven en Site configuration > Environment
# variables (ver docs/deploy-netlify.md).
[build]
  base = "webApp"
  # Sin caché de Next entre builds: el 2026-11-09 un build reusó globals.css viejo con tokens.css
  # nuevo y producción salió sin las reglas .cosmico (títulos oscuros sobre el cielo). check-seo lo vigila.
  # G-03 (T-098): Vitest delante del build (~25 s, sin red ni stack). Con `&&` un test rojo corta el
  # deploy y producción sigue en la versión anterior. La suite PGlite no corre acá: tarda minutos.
  command = "rm -rf .next/cache && npm test && npm run build"
  publish = ".next"

[build.environment]
  # Igual que .nvmrc. Netlify busca .nvmrc en `base`, y el nuestro está en la raíz.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Adaptador de Next declarado y fijado (devDependency 5.16.5): la autoinstalación del runtime no
# corrió en el primer build desde Git (deploy sin funciones, todo 404).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Imágenes propias: sin esto Netlify las sirve con max-age=0 y el navegador vuelve a pedirlas en
# cada visita (~0,6 s el hero de la portada). Vale también para las versiones que arma el Image CDN
# desde /_next/image. Una semana: si la dueña reemplaza una imagen con el mismo nombre, tarda
# hasta eso en verse; mejor darle un nombre nuevo.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/tarot/rws/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
